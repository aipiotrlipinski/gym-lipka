# Każdy push do main buduje aplikację APK i wystawia ją pod stałym adresem:
# https://github.com/aipiotrlipinski/gym-lipka/releases/download/apk/gym-lipka.apk
name: Aplikacja APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - run: npm run build:apk
      - name: Budowa APK
        working-directory: android
        run: |
          chmod +x gradlew
          # Przy błędzie najważniejsze linie trafiają do adnotacji (widać je bez otwierania logu).
          if ! ./gradlew assembleRelease --no-daemon > gradle.log 2>&1; then
            tail -40 gradle.log
            { grep -E "^e: |error:" gradle.log | head -20; grep -A12 "What went wrong" gradle.log | head -40; } | while IFS= read -r line; do
              echo "::error::${line//%/%25}"
            done
            exit 1
          fi
          cp app/build/outputs/apk/release/app-release.apk ../gym-lipka.apk
      - uses: actions/upload-artifact@v4
        with:
          name: gym-lipka-apk
          path: gym-lipka.apk
      - name: Publikacja pod stałym adresem
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk
          name: Gym Lipka — aplikacja APK
          body: |
            Najnowsza wersja aplikacji (build ${{ github.run_number }}).
            Pobierz plik gym-lipka.apk na telefonie i zainstaluj. Nowa wersja instaluje się na starej, dane zostają.
          files: gym-lipka.apk
          make_latest: true
