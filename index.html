<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/gym-lipka/favicon.png" />
    <link rel="apple-touch-icon" href="/gym-lipka/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F6F5F1" />
    <title>Gym Lipka</title>
    <script>
      // Ustaw motyw przed pierwszym rysowaniem, żeby ekran nie mignął na biało.
      try {
        var m = localStorage.getItem('gl-theme') || 'system';
        var dark = m === 'dark' || (m === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
